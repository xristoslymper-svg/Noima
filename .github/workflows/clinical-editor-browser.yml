name: Clinical editor browser checks
on:
  pull_request:
    paths:
      - 'components/patients/**'
      - 'components/dictation/**'
      - 'app/*css'
      - 'lib/clinical/mse-review.ts'
      - 'browser-tests/clinical-editor-cleanup*'
      - '.github/workflows/clinical-editor-browser.yml'
permissions:
  contents: read
concurrency:
  group: clinical-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.57.0 esbuild@0.25.0
      - run: npx playwright install --with-deps chromium
      - name: Test actual clinical editors with synthetic state
        run: node browser-tests/clinical-editor-cleanup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinical-editor-evidence
          path: |
            test-results/clinical-editor-cleanup/*.png
            test-results/clinical-editor-cleanup/report.json
          retention-days: 7
