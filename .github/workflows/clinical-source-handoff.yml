name: Clinical source handoff
on:
  push:
    branches: [refine/clinical-editor-polish-20261010]
    paths: [.github/workflows/clinical-source-handoff.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=/tmp/noima-reviewed-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: clinical-source
          path: /tmp/noima-reviewed-source.zip
          retention-days: 1
