name: Clinical editor browser checks
on:
  pull_request:
    paths:
      - 'components/patients/**'
      - 'components/dictation/**'
      - 'app/*.css'
      - 'app/layout.tsx'
      - 'lib/clinical/**'
      - 'browser-tests/clinical-cleanup*'
      - 'browser-tests/warm-patient-workspace*'
      - 'browser-tests/clinical-reliability*'
      - 'browser-tests/fixtures/warm-patient.json'
      - '.github/workflows/clinical-ui.yml'
permissions:
  contents: read
concurrency:
  group: clinical-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-and-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact reviewed source and clean worktree
        run: |
          git status --short
          git diff --exit-code
          git log -3 --oneline
          git ls-files '*AGENTS.md' '*CONTRIBUTING*' '*instructions*'
          git bundle create /tmp/noima-reviewed-source.bundle HEAD
          git rev-parse HEAD > /tmp/noima-reviewed-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clinical-reviewed-source
          path: |
            /tmp/noima-reviewed-source.bundle
            /tmp/noima-reviewed-sha.txt
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.57.0 esbuild@0.25.0
      - run: npx playwright install --with-deps chromium
      - run: node browser-tests/clinical-cleanup.mjs
      - run: node browser-tests/warm-patient-workspace.mjs
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinical-editor-evidence
          path: |
            test-results/clinical-cleanup
            test-results/warm-patient-workspace
            test-results/clinical-reliability
          retention-days: 7
