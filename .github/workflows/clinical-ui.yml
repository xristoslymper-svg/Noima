name: Clinical editor browser checks
on:
  pull_request:
    paths:
      - 'components/patients/**'
      - 'app/patients/page.tsx'
      - 'app/patients/new/**'
      - 'lib/patients/patient-entry.ts'
      - 'browser-tests/patient-entry*'
      - 'lib/intake/patient-report.ts'
      - 'components/dictation/**'
      - 'app/*.css'
      - 'app/layout.tsx'
      - 'lib/clinical/**'
      - 'browser-tests/clinical-cleanup*'
      - 'components/intake/IntakeLauncher.tsx'
      - 'browser-tests/treatment-polish*'
      - 'browser-tests/warm-patient-workspace*'
      - 'browser-tests/clinical-reliability*'
      - 'browser-tests/fixtures/warm-patient.json'
      - '.github/workflows/clinical-ui.yml'
permissions:
  contents: read
concurrency:
  group: clinical-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-and-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.57.0 esbuild@0.25.0
      - run: npx playwright install --with-deps chromium
      - run: node browser-tests/patient-entry.mjs
      - run: node browser-tests/summary-brief.mjs
        if: ${{ !cancelled() }}
      - run: node browser-tests/treatment-polish.mjs
        if: ${{ !cancelled() }}
      - run: node browser-tests/clinical-cleanup.mjs
        if: ${{ !cancelled() }}
      - run: node browser-tests/warm-patient-workspace.mjs
        if: ${{ !cancelled() }}
      - run: node browser-tests/clinical-reliability.mjs
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinical-editor-evidence
          path: |
            test-results/patient-entry
            test-results/clinical-cleanup
            test-results/summary-brief
            test-results/treatment-polish
            test-results/warm-patient-workspace
            test-results/clinical-reliability
          retention-days: 7
