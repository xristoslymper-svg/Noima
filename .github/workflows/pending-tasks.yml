name: Pending tasks browser checks
on:
  push:
    branches: ['codex/reliable-pending-tasks']
  pull_request:
    paths:
      - 'app/page.tsx'
      - 'app/api/overview/**'
      - 'app/overview-search.css'
      - 'components/overview/PendingTasks*'
      - 'lib/overview/pending-*'
      - 'browser-tests/pending-*'
      - '.github/workflows/pending-tasks.yml'
permissions:
  contents: read
concurrency:
  group: pending-tasks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.57.0 esbuild@0.25.0
      - run: npx playwright install --with-deps chromium
      - run: node browser-tests/pending-tasks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-tasks-evidence
          path: test-results/pending-tasks
          retention-days: 7
