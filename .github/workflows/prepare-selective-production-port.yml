name: Prepare selective production port
on:
  push:
    branches: ['feat/production-library-prior-course-20261017']
    paths: ['scripts/prepare-selective-port.cjs', '.github/workflows/prepare-selective-production-port.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply only pinned library changes and Visits integration
        run: |
          node scripts/prepare-selective-port.cjs
          sed -i 's/[[:blank:]]*$//' app/psychometrics/page.tsx components/intake/PatientIntakeForm.tsx app/api/intake/public/route.ts app/intake/blank/BlankPrint.tsx
      - name: Publish only to the dedicated draft branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app components lib supabase tests scripts .github/workflows/prepare-selective-production-port.yml .github/workflows/selective-port-source.yml
          git commit -m 'Port Greek library intake and inline prior course onto unchanged production folder'
          git push origin HEAD:refs/heads/feat/production-library-prior-course-20261017
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)"
      - name: TypeScript, lint, unit/database tests and production build
        env:
          CLINICAL_DATA_MODE: synthetic
          EXTERNAL_AI_ENABLED: 'false'
        run: |
          set +e
          mkdir -p /tmp/port-validation
          result=0
          for task in typecheck lint test build; do
            npm run "$task" > "/tmp/port-validation/$task.log" 2>&1
            status=$?
            echo "CHECK $task EXIT $status"
            tail -n 35 "/tmp/port-validation/$task.log"
            if [ "$status" -ne 0 ]; then
              grep -n -A 20 -B 3 -E 'not ok|error TS|Error:|error  ' "/tmp/port-validation/$task.log" | head -n 180
              result=1
            fi
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-validation
          path: /tmp/port-validation/
          retention-days: 5
