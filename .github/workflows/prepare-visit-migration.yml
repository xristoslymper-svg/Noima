name: Prepare independent visit migration
on:
  push:
    branches: [codex/patient-entry-recovery]
    paths: [.github/workflows/prepare-visit-migration.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes supabase migration new --help
      - run: npx --yes supabase migration new independent_visit_registration
