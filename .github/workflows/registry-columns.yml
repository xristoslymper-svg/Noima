name: Patient registry columns
on: [push, pull_request]
permissions:
  contents: read
jobs:
  registry-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.57.0 esbuild@0.25.0
      - run: npx playwright install --with-deps chromium
      - run: node browser-tests/registry-columns.mjs
      - run: node browser-tests/current-i18n.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-columns-evidence
          path: |
            test-results/registry-columns
            test-results/current-i18n
          retention-days: 7
