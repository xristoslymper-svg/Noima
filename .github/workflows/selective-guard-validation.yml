name: Selective guard validation
on:
  push:
    branches: ['feat/production-library-prior-course-20261017']
    paths: ['.github/workflows/selective-guard-validation.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLINICAL_DATA_MODE: synthetic
      EXTERNAL_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Keep navigation guard synchronized before user interaction
        run: |
          node <<'NODE'
          const fs=require('fs');
          function patch(file,old,next){const s=fs.readFileSync(file,'utf8');if(s.split(old).length!==2)throw Error('Unexpected context '+file+' '+old);fs.writeFileSync(file,s.replace(old,next))}
          const file='components/patients/PriorCourseSection.tsx';
          patch(file,'useCallback,useEffect,useId','useCallback,useEffect,useLayoutEffect,useId');
          patch(file,"const guard=useCallback(async()=>{if(pending)throw new Error('Αποθηκεύστε ή ακυρώστε την προηγούμενη κλινική πορεία πριν αλλάξετε περιοχή.')},[pending]);", "const pendingRef=useRef(pending);pendingRef.current=pending;\n const guard=useCallback(async()=>{if(pendingRef.current)throw new Error('Αποθηκεύστε ή ακυρώστε την προηγούμενη κλινική πορεία πριν αλλάξετε περιοχή.')},[]);");
          patch(file,'useEffect(()=>{if(!beforeNavigate)return;beforeNavigate.current=guard;return()=>{if(beforeNavigate.current===guard)beforeNavigate.current=null}},[beforeNavigate,guard]);','useLayoutEffect(()=>{if(!beforeNavigate)return;beforeNavigate.current=guard;return()=>{if(beforeNavigate.current===guard)beforeNavigate.current=null}});');
          patch(file,'className={styles.section} aria-label="Προηγούμενη κλινική πορεία"','className={styles.section} data-prior-pending={pending} aria-label="Προηγούμενη κλινική πορεία"');
          patch('browser-tests/selective-port.mjs',"page.on('pageerror',e=>errors.push(e.message))","page.on('pageerror',e=>{errors.push(e.message);console.error('BROWSER_ERROR',e.message)})");
          patch('browser-tests/selective-port.mjs',"await nav.getByRole('button',{name:'Σύνοψη',exact:true}).click();assert.match(page.url(),/tab=timeline/);assert.equal(await text.inputValue(),content);", "assert.equal(await prior.getAttribute('data-prior-pending'),'true');await nav.getByRole('button',{name:'Σύνοψη',exact:true}).click();await page.waitForTimeout(200);console.log('GUARD_STATE',JSON.stringify({url:page.url(),pending:await prior.getAttribute('data-prior-pending').catch(()=>null),alerts:await page.getByRole('alert').allTextContents(),textareas:await page.locator('textarea').count()}));await check(page,'prior-navigation-guard',size);assert.match(page.url(),/tab=timeline/);assert.equal(await text.inputValue(),content);");
          fs.unlinkSync('.github/workflows/selective-guard-validation.yml');
          NODE
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/patients/PriorCourseSection.tsx browser-tests/selective-port.mjs .github/workflows/selective-guard-validation.yml
          git commit -m 'Keep prior-course draft guard current across inline edits and patient navigation'
          git push origin HEAD:refs/heads/feat/production-library-prior-course-20261017
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
      - run: npm run typecheck && npm run lint
      - run: node --experimental-strip-types --test tests/selective-production.test.mjs tests/selective-library-database.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.57.0 esbuild@0.25.0
      - run: npx playwright install --with-deps chromium
      - run: node browser-tests/selective-port.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-guard-evidence
          path: test-results/selective-port
          retention-days: 7
