name: Selective port workspace
on:
  push:
    branches: [feat/prod-library-prior-course-20261017]
    paths: [.github/workflows/selective-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tools in an empty temporary workspace
        run: |
          mkdir -p browser-tools
          cd browser-tools
          npm install --ignore-scripts --no-audit --no-fund playwright@1.57.0 esbuild@0.25.0
          tar -czf ../noima-browser-tools.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: selective-browser-tools
          path: noima-browser-tools.tar.gz
          compression-level: 0
          retention-days: 3
