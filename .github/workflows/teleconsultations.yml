name: Teleconsultations synthetic browser checks
on:
  pull_request:
    paths:
      - 'components/teleconsultations/**'
      - 'components/patients/FollowupDraft.tsx'
      - 'components/dictation/ClinicalTextField.tsx'
      - 'lib/teleconsultations/**'
      - 'browser-tests/teleconsultations*'
      - 'browser-tests/teleconsultation-persistence*'
      - 'tests/teleconsultation-persistence.test.mjs'
      - 'tests/teleconsultation-database.test.mjs'
      - '.github/workflows/teleconsultations.yml'
permissions:
  contents: read
concurrency:
  group: teleconsultations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.57.0 esbuild@0.25.0
      - run: npx playwright install --with-deps chromium
      - run: node browser-tests/teleconsultations.mjs
      - run: node browser-tests/teleconsultation-persistence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teleconsultations-synthetic-evidence
          path: |
            test-results/teleconsultations
            test-results/teleconsultation-persistence
          retention-days: 7
